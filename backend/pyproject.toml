[project]
name = "pacerule"
version = "0.1.0"
description = "校园跑步打卡：轨迹记录、规则校验、教师端复核"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
