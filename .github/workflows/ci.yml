name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx ruff
      - run: ruff check .
      - run: pytest -q

  licenses:
    name: licenses (dependency scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-licenses
      - name: Fail on GPL/AGPL dependency
        run: |
          pip-licenses --format=csv --with-system | tee /tmp/licenses.csv
          if grep -Ei 'GPL' /tmp/licenses.csv | grep -v 'LGPL'; then
            echo "发现 GPL/AGPL 依赖，本项目 MIT，需替换后再提交。"
            exit 1
          fi

  mobile:
    name: mobile (flutter analyze + test)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('mobile/pubspec.yaml') != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  admin:
    name: admin (next build)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('admin/package.json') != '' }}
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
